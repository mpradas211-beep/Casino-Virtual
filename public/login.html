<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtualCasino — Ingresar</title>
<style>
  :root {
    --felt-dark: #0b2b1f;
    --felt: #123c2b;
    --felt-light: #1c5940;
    --gold: #d4af6a;
    --gold-bright: #f0cf8e;
    --ivory: #f2ece1;
    --muted: #8fa89a;
    --danger: #e08a7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ivory);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, #0e2f22, #0a2018);
    border: 1px solid rgba(212,175,106,0.35);
    border-radius: 18px;
    padding: 32px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .brand { text-align: center; margin-bottom: 24px; }
  .brand .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
  .brand h1 {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 26px;
    color: var(--gold-bright);
    margin: 4px 0 0;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(212,175,106,0.25);
    background: rgba(0,0,0,0.25);
    color: var(--ivory);
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button {
    width: 100%;
    height: 46px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #2b2110;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 4px;
  }
  .switch {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .switch a { color: var(--gold); cursor: pointer; text-decoration: underline; }
  .msg { min-height: 18px; font-size: 13px; color: var(--danger); text-align: center; margin-bottom: 8px; }
  .demo-hint {
    margin-top: 18px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="eyebrow">Bienvenido a</div>
    <h1 id="title">VirtualCasino</h1>
  </div>

  <div class="msg" id="msg"></div>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username" value="demo@casino.com">

    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password" value="demo1234">

    <button type="submit" id="submitBtn">Ingresar</button>
  </form>

  <div class="switch">
    <span id="switchText">¿No tenés cuenta? <a id="switchLink">Registrate</a></span>
  </div>

  <div class="demo-hint">
    Ya hay una cuenta de prueba cargada con $500 — solo tenés que apretar "Ingresar".
  </div>
</div>

<script>
  let mode = 'login'; // o 'registro'
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const title = document.getElementById('title');
  const submitBtn = document.getElementById('submitBtn');
  const switchText = document.getElementById('switchText');
  const switchLink = document.getElementById('switchLink');

  function setMode(newMode) {
    mode = newMode;
    msg.textContent = '';
    if (mode === 'login') {
      title.textContent = 'VirtualCasino';
      submitBtn.textContent = 'Ingresar';
      switchText.innerHTML = '¿No tenés cuenta? <a id="switchLink">Registrate</a>';
    } else {
      title.textContent = 'Crear cuenta';
      submitBtn.textContent = 'Registrarme';
      switchText.innerHTML = '¿Ya tenés cuenta? <a id="switchLink">Ingresá</a>';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    }
    document.getElementById('switchLink').addEventListener('click', () => {
      setMode(mode === 'login' ? 'registro' : 'login');
    });
  }
  switchLink.addEventListener('click', () => setMode('registro'));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      if (mode === 'registro') {
        const r = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) { msg.textContent = data.error; return; }
        setMode('login');
        msg.style.color = '#6fae7a';
        msg.textContent = 'Cuenta creada. Ahora ingresá.';
        return;
      }

      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) { msg.textContent = data.error; return; }

      localStorage.setItem('vc_token', data.token);
      window.location.href = '/juego.html';
    } catch (err) {
      msg.textContent = 'No se pudo conectar con el servidor';
    }
  });
</script>

</body>
</html>
