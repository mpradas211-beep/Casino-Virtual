<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtualCasino — Fortuna Triple</title>
<style>
  :root {
    --felt-dark: #0b2b1f;
    --felt: #123c2b;
    --felt-light: #1c5940;
    --gold: #d4af6a;
    --gold-bright: #f0cf8e;
    --ivory: #f2ece1;
    --muted: #8fa89a;
    --success: #6fae7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ivory);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .cabinet {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #0e2f22, #0a2018);
    border: 1px solid rgba(212,175,106,0.35);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .brand h1 { font-family: Georgia, serif; font-weight: 400; font-size: 22px; color: var(--gold-bright); margin: 0; }
  .logout { font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; }
  .balance-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 16px; background: rgba(0,0,0,0.25); border-radius: 10px;
    margin-bottom: 18px; border: 1px solid rgba(212,175,106,0.15);
  }
  .balance-row .label { font-size: 12px; color: var(--muted); }
  .balance-row .value { font-family: Georgia, serif; font-size: 22px; color: var(--ivory); }
  .reels { display: flex; gap: 10px; background: #071a12; padding: 16px; border-radius: 12px; border: 1px solid rgba(212,175,106,0.25); margin-bottom: 16px; }
  .reel-window { flex: 1; height: 90px; background: #0d271b; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
  .result-line { text-align: center; min-height: 20px; font-size: 13px; color: var(--gold); margin-bottom: 16px; }
  .result-line.win { color: var(--success); }
  .result-line.lose { color: var(--muted); }
  .controls { display: flex; gap: 10px; align-items: center; }
  .stake-control { display: flex; align-items: center; background: rgba(0,0,0,0.25); border-radius: 10px; border: 1px solid rgba(212,175,106,0.15); overflow: hidden; }
  .stake-control button { background: none; border: none; color: var(--gold); font-size: 18px; width: 38px; height: 44px; cursor: pointer; }
  .stake-control .amount { width: 56px; text-align: center; font-size: 15px; }
  .spin-btn { flex: 1; height: 48px; border-radius: 10px; border: none; background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #2b2110; font-size: 15px; font-weight: 500; cursor: pointer; }
  .spin-btn:disabled { opacity: 0.55; cursor: default; }
  .paytable { margin-top: 18px; border-top: 1px solid rgba(212,175,106,0.15); padding-top: 12px; }
  .paytable-title { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .paytable-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .paytable-row span:last-child { color: var(--gold); }
</style>
</head>
<body>

<div class="cabinet">
  <div class="topbar">
    <div class="brand"><h1>Fortuna Triple</h1></div>
    <span class="logout" id="logoutBtn">Salir</span>
  </div>

  <div class="balance-row">
    <div>
      <div class="label">Saldo (servidor)</div>
      <div class="value" id="balance">$0.00</div>
    </div>
    <div style="text-align:right">
      <div class="label">RTP objetivo</div>
      <div class="value" style="font-size:16px">96.0%</div>
    </div>
  </div>

  <div class="reels" id="reels">
    <div class="reel-window" id="reel0">🍒</div>
    <div class="reel-window" id="reel1">🍋</div>
    <div class="reel-window" id="reel2">🔔</div>
  </div>

  <div class="result-line" id="resultLine">Ajustá tu apuesta y girá</div>

  <div class="controls">
    <div class="stake-control">
      <button id="stakeDown">−</button>
      <div class="amount" id="stakeAmount">$5</div>
      <button id="stakeUp">+</button>
    </div>
    <button class="spin-btn" id="spinBtn">Girar</button>
  </div>

  <div class="paytable">
    <div class="paytable-title">Tabla de pagos (3 iguales)</div>
    <div class="paytable-row"><span>🍒 🍒 🍒</span><span>×2</span></div>
    <div class="paytable-row"><span>🍋 🍋 🍋</span><span>×3</span></div>
    <div class="paytable-row"><span>🔔 🔔 🔔</span><span>×5</span></div>
    <div class="paytable-row"><span>🍫 🍫 🍫</span><span>×10</span></div>
    <div class="paytable-row"><span>7️⃣ 7️⃣ 7️⃣</span><span>×50</span></div>
  </div>
</div>

<script>
  const SYMBOL_EMOJI = { CHERRY: '🍒', LEMON: '🍋', BELL: '🔔', CHOCO: '🍫', SEVEN: '7️⃣' };
  const STAKE_STEPS = [1, 2, 5, 10, 25, 50, 100];
  let stakeIndex = 2;
  let spinning = false;

  const token = localStorage.getItem('vc_token');
  if (!token) window.location.href = '/login.html';

  const balanceEl = document.getElementById('balance');
  const stakeAmountEl = document.getElementById('stakeAmount');
  const resultLine = document.getElementById('resultLine');
  const spinBtn = document.getElementById('spinBtn');
  const reelEls = [0, 1, 2].map(i => document.getElementById('reel' + i));

  function fmt(n) { return '$' + n.toFixed(2); }
  function renderStake() { stakeAmountEl.textContent = '$' + STAKE_STEPS[stakeIndex]; }

  async function authedFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { ...(options.headers || {}), Authorization: 'Bearer ' + token },
    });
    if (res.status === 401) {
      localStorage.removeItem('vc_token');
      window.location.href = '/login.html';
      throw new Error('No autenticado');
    }
    return res;
  }

  async function loadBalance() {
    const res = await authedFetch('/api/saldo');
    const data = await res.json();
    balanceEl.textContent = fmt(data.balance);
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('vc_token');
    window.location.href = '/login.html';
  });

  document.getElementById('stakeUp').addEventListener('click', () => {
    if (spinning) return;
    stakeIndex = Math.min(stakeIndex + 1, STAKE_STEPS.length - 1);
    renderStake();
  });
  document.getElementById('stakeDown').addEventListener('click', () => {
    if (spinning) return;
    stakeIndex = Math.max(stakeIndex - 1, 0);
    renderStake();
  });

  spinBtn.addEventListener('click', async () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultLine.textContent = 'Girando...';
    resultLine.className = 'result-line';

    try {
      const res = await authedFetch('/api/girar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stake: STAKE_STEPS[stakeIndex] }),
      });
      const data = await res.json();

      if (!res.ok) {
        resultLine.textContent = data.error;
        resultLine.className = 'result-line lose';
        spinning = false;
        spinBtn.disabled = false;
        return;
      }

      setTimeout(() => {
        reelEls.forEach((el, i) => { el.textContent = SYMBOL_EMOJI[data.reels[i]]; });
        balanceEl.textContent = fmt(data.balance);

        if (data.payout > 0) {
          resultLine.textContent = '¡Ganaste ' + fmt(data.payout) + '!';
          resultLine.className = 'result-line win';
        } else {
          resultLine.textContent = 'Sin premio esta vez';
          resultLine.className = 'result-line lose';
        }
        spinning = false;
        spinBtn.disabled = false;
      }, 500);
    } catch (err) {
      spinning = false;
      spinBtn.disabled = false;
    }
  });

  renderStake();
  loadBalance();
</script>

</body>
</html>
